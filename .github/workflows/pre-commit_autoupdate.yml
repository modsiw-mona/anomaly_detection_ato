name: Pre-commit auto-update
# Run on demand only, from the Actions tab.
#
# The scheduled run was removed deliberately: this workflow opens a pull
# request, which GITHUB_TOKEN cannot do here (Actions default to read-only and
# "create and approve pull requests" is disabled), and PRs it did open would
# not trigger CI. The alternative, a classic PAT with `repo` scope, grants
# account-wide read/write to every repository just to bump hook versions.
#
# Updating hooks locally is equivalent and needs no stored credential:
#   make pre-commit_update
#
# To automate this later, use a FINE-GRAINED PAT limited to this repository
# (Contents: read/write, Pull requests: read/write) with an expiry date, stored
# as the `PAT` secret, and restore the schedule below.
on:
  # on demand
  workflow_dispatch:
#
jobs:
  pre-commit-update:
    runs-on: ubuntu-latest
    name:
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update pre-commit hooks
        uses: brokenpip3/action-pre-commit-update@0.0.5
        with:
          github-token: ${{ secrets.PAT }}
          update-freeze: false
      - name: Add label
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: 'auto-update-pre-commit-hooks'
            });
            if (pullRequests.length > 0) {
              const prNumber = pullRequests[0].number;
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['automerge']
              });
            }
#
