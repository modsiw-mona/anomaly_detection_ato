[project]
name = "anomaly-detection-ato"
version = "0.1.0"
description = "Master's thesis project on Account Take Over (ATO) detection in authentication records using anomaly detection methodologies"
authors = [
    { name = "Sofia A", email = "sofiaarangopat@hotmail.com" },
]
requires-python = ">=3.14"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "pandas[parquet]>=3.0.6",
    "pandera[polars]>=0.35.0",
    "polars>=2.1.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "streamlit>=1.66.1",
    "xgboost>=3.4.1 ; sys_platform != 'linux'",
    "xgboost-cpu>=3.4.1 ; sys_platform == 'linux'",
]

[project.urls]
documentation = "https://modsiw-mona.github.io/anomaly_detection_ato"
repository = "https://github.com/modsiw-mona/anomaly_detection_ato"


[dependency-groups]
dev = [
    "pre-commit>=4.6.2", # Code linting and formatting
    "pytest>=9.1.1", # Testing framework
    "pytest-cov>=7.1.0",
    "cruft[pyproject]>=2.16.0",# Automated Cookiecutter template synchronization
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "types-pyyaml>=6.0.12.20261030",
]

#
docs = [
    "zensical>=0.1.0",
]
#

[tool.uv]
package = false
default-groups = [
    "dev",
#
    "docs",
#
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.run]
source = ["src"]
omit = ["**/__init__.py"]
