[project]
name = "anomaly-detection-ato"
version = "0.1.0"
description = "Master's thesis project on Account Take Over (ATO) detection in authentication records using anomaly detection methodologies"
authors = [
    { name = "Sofia A", email = "sofiaarangopat@hotmail.com" },
]
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "numpy>=2.5.3",
    "pandas[parquet]>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.urls]
documentation = "https://modsiw-mona.github.io/anomaly_detection_ato"
repository = "https://github.com/modsiw-mona/anomaly_detection_ato"


[dependency-groups]
dev = [
    "pre-commit>=4.6.2", # Code linting and formatting
    "pytest>=9.1.1", # Testing framework
    "pytest-cookies>=0.7.0",
    "pytest-cov>=7.1.0",
    "cruft[pyproject]>=2.16.0",# Automated Cookiecutter template synchronization
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

#
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pymdown-extensions>=10.19",
]
#

[tool.uv]
package = false
default-groups = [
    "dev",
#
    "docs",
#
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.run]
source = ["src"]
omit = ["**/__init__.py"]
