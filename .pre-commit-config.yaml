repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^(mkdocs\.yml|{{cookiecutter.repo_name}}/mkdocs\.yml)$
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=100000] # 100MB

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-dependabot

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.2
    hooks:
      # Run the linter
      - id: ruff-check
        args:
          - --fix
          - --config
          - .code_quality/ruff.toml # Run the formatter.
      - id: ruff-format
        args:
          - --config
          - .code_quality/ruff.toml

  # mypy runs from the project environment (uv) so it type-checks against the real
  # installed libraries (polars, pydantic, ...) instead of treating them as `Any`.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy --config-file=.code_quality/mypy.ini
        language: system
        types: [python]
        require_serial: true

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]
