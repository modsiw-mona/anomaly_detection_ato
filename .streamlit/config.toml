# No usage statistics sent anywhere. `make demo` serves on 127.0.0.1 only (set on its command line, so the
# public deployment on Streamlit Community Cloud can use its own address).
[browser]
gatherUsageStats = false

[server]
headless = true

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#6B3FA0"  # purple accent (buttons, sliders, switches)
