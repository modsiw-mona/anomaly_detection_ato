# Translation file for the "Login Data Set for Risk-Based Authentication".
#
# Maps this dataset's column names onto the canonical schema (src/data/schema.py) and records
# provenance, verification and known artefacts. Full context: docs/datasets/rba.md
#
# Loaded with yaml.safe_load and validated by src/data/datasets.py — unknown keys and invalid
# values are rejected. Strings are quoted on purpose: YAML 1.1 (PyYAML) silently turns unquoted
# words such as `yes`, `no`, `on` and `off` into booleans.

name: "rba"
description: >-
  Synthesized login feature data of 31.3M login attempts by 3.3M users (4.3M distinct user IDs,
  counting IDs seen only in failed attempts) of a large-scale single sign-on service in Norway,
  collected February 2020 - February 2021.
  Per-user and global frequencies of the categorical features match the real data; the values
  themselves are synthetic.

source:
  url: "https://zenodo.org/api/records/6782156/files/rba-dataset.zip/content"
  archive: "rba-dataset.zip"
  md5: "cc1b1078b3929650e6c08678caffcc57"
  member: "rba-dataset.csv"
  max_uncompressed_bytes: 10000000000  # archive expands to 9.06 GB
  doi: "10.5281/zenodo.6782156"
  version: "v1.0.0"
  license: "CC-BY-4.0"
  citation: >-
    Wiefling, S., Jørgensen, P. R., Thunem, S., & Lo Iacono, L. (2022). Pump Up Password Security!
    Evaluating and Enhancing Risk-Based Authentication on a Real-World Large-Scale Online Service.
    ACM Transactions on Privacy and Security, 26(1). https://doi.org/10.1145/3546069
  homepage: "https://github.com/das-group/rba-dataset"
  mirrors:
    - "https://www.kaggle.com/datasets/dasgroup/rba-dataset"

# canonical field: "column name in this dataset"
columns:
  user_id: "User ID"
  timestamp: "Login Timestamp"
  login_success: "Login Successful"
  ip: "IP Address"
  asn: "ASN"
  device_type: "Device Type"
  user_agent: "User Agent String"
  country: "Country"
  region: "Region"
  city: "City"
  os: "OS Name and Version"
  browser: "Browser Name and Version"
  rtt_ms: "Round-Trip Time [ms]"

labels:
  label_ato: "Is Account Takeover"
  label_attack_ip: "Is Attack IP"

# How raw values are read (measured on the full file in notebook 2).
timestamp_format: "%Y-%m-%d %H:%M:%S%.f"   # e.g. 2020-02-03 12:43:30.772; single format, 23 chars

# Values that mean "missing", declared per column. Never global: "Nan" is a real region
# (Nan province, Thailand), and "unknown" is a real Device Type category.
null_markers:
  region: ["-"]
  city: ["-"]

# User IDs are 64-bit integer pseudonyms in this dataset.
identifier_dtypes:
  user_id: "Int64"

# Placeholders the authors had to invent to resolve conflicts during synthesis (dataset README,
# "Regarding the Data Values"). They are flagged, quantified and checked with an ablation — not
# deleted. See docs/development-plan.md, section 4.4.
artefacts:
  - name: "asn_is_placeholder"
    field: "asn"
    kind: "at_least"
    value: 500000
    meaning: "ASN does not exist in reality; assigned to resolve a data-creation conflict."
  - name: "ip_is_placeholder"
    field: "ip"
    kind: "in_network"
    value: "10.0.0.0/8"
    meaning: "Private-range IP that cannot appear on the public internet; synthesis placeholder."

# A user ID that is not a person (measured in notebook 3-analysis): 14,025,899 attempts (45% of all
# rows) with 4 successes, from 227 countries, 11,694 ASNs and 14% bots, spanning the whole period.
# Almost certainly a bucket for attempts against unknown accounts. Kept in the data, excluded from
# per-user behaviour (a "history" for it means nothing).
catch_all_user_ids: ["-4324475583306591935"]

# Dataset-specific validation rules (src/data/validation.py), each backed by a measurement in
# notebooks 2-exploration and 3-analysis. Generic rules (types, required fields) come from the schema.
validation:
  timestamp_range: ["2020-02-01", "2021-03-01"]   # observed 2020-02-03 → 2021-02-28
  unique_together: ["user_id", "timestamp"]        # 0 duplicates measured
  allowed_values:
    device_type: ["mobile", "desktop", "tablet", "bot", "unknown"]   # authors' README + measured
  patterns:
    country: "^[A-Z]{2}$"   # ISO 3166-1 alpha-2, all 216 values
    asn: "^[0-9]+$"          # identifiers made of digits
  numeric_ranges:
    rtt_ms: [1, 8600000]     # authors' README range; observed 8 – 223,457 ms
